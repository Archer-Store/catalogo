        let catActual = 'Todos';

        function renderProductos() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            productos.forEach((p, index) => {
                const matchCat = catActual === 'Todos' || p.categoria.toLowerCase() === catActual.toLowerCase();
                const matchSearch = p.personaje.toLowerCase().includes(search) || p.franquicia.toLowerCase().includes(search);

                if (matchCat && matchSearch) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let badgeHTML = p.destacado ? `<div class="badge">Más Vendido</div>` : '';
                    let meliBtnHTML = p.link_meli ? `<a href="${p.link_meli}" target="_blank" class="btn btn-meli">Ver en MercadoLibre</a>` : '';

                    card.innerHTML = `
                        ${badgeHTML}
                        <div class="carousel" id="carousel-${index}" onmouseenter="pausarCarrusel(${index})" onmouseleave="reanudarCarrusel(${index})">
                            <img id="img-${index}" src="${p.fotos[0]}" alt="${p.personaje}">
                        </div>
                        <div class="card-body">
                            <div class="title">${p.personaje}</div>
                            <div class="sub">${p.franquicia}</div>
                            <div class="prices">
                                <div class="price-wsp">$${p.precio_transf.toLocaleString('es-AR')} ARS</div>
                                ${p.precio_meli ? `<div class="price-meli">ML: $${p.precio_meli.toLocaleString('es-AR')}</div>` : ''}
                            </div>
                            <div class="btn-group">
                                ${meliBtnHTML}
                                <a href="${p.link_wsp}" target="_blank" class="btn btn-wsp">Pedir por WhatsApp</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                    iniciarCarrusel(index, p.fotos);
                }
            });
        }

        const carruseles = {};

        function iniciarCarrusel(id, fotos) {
            if (fotos.length <= 1) return;
            let current = 0;
            carruseles[id] = setInterval(() => {
                current = (current + 1) % fotos.length;
                const img = document.getElementById(`img-${id}`);
                if (img) img.src = fotos[current];
            }, 3000);
        }

        function pausarCarrusel(id) { clearInterval(carruseles[id]); }
        function reanudarCarrusel(id) {
            const p = productos[id];
            if (p && p.fotos.length > 1) iniciarCarrusel(id, p.fotos);
        }

        function filtrarCategoria(cat) {
            catActual = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderProductos();
        }

        document.getElementById('searchInput').addEventListener('input', renderProductos);
        renderProductos();
    </script>
